name: CI

# Checks on pull requests and on branches other than main.
#
# A push to main runs the same gate inside deploy.yml before publishing, so
# running it here too would duplicate every job for no added signal.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `prebuild` regenerates the image derivatives from assets/source, and
      # `postbuild` renames the emitted directories to the translated pathnames.
      - name: Build
        run: npm run build

      # Catches the translated-pathname failure directly, in case postbuild
      # ever stops running.
      - name: Internal links resolve
        run: npm run check:links

      - name: SEO tags
        run: npm run check:seo

      - name: Dead links and controls
        run: npm run check:interactive

      - name: Accessibility
        run: npm run check:a11y

      - name: Performance budget
        run: npm run check:budget
